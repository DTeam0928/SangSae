plugins {
  id 'java'
  id 'war'
}

group = 'com.dteam0928.sangsae'
version = '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.14.4'
}

java {
  sourceCompatibility = '21'
  targetCompatibility = '21'
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  compileOnly('jakarta.servlet:jakarta.servlet-api:6.0.0')
  implementation('org.hibernate:hibernate-core:6.6.55.Final')
  implementation('org.glassfish.jaxb:jaxb-runtime:4.0.9')
  implementation('org.hibernate.validator:hibernate-validator:8.0.5.Final')

  // JSON 파싱 (카카오 REST API 응답 파싱 및 서블릿 비동기 통신용)
  implementation('com.google.code.gson:gson:2.11.0')

  // MySQL 드라이버 및 HikariCP 고속 커넥션 풀
  implementation('com.mysql:mysql-connector-j:8.3.0')
  implementation('com.zaxxer:HikariCP:5.1.0')

  // JSP JSTL 태그 라이브러리 (Jakarta EE 10 / Tomcat 10.1+ 호환)
  implementation('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0')
  implementation('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')

  testImplementation(platform("org.junit:junit-bom:5.11.4"))
  testImplementation("org.junit.jupiter:junit-jupiter")
  testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
useJUnitPlatform()}