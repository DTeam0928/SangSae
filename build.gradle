plugins {
  id 'java'
  id 'war'
}

group = 'com.dteam0928.sangsae'
version = '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.14.4'
}

java {
  sourceCompatibility = '21'
  targetCompatibility = '21'
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  compileOnly('jakarta.servlet:jakarta.servlet-api:6.0.0')

  // JSP / JSTL 3.0 (Tomcat 10.1 용)
  implementation('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0')
  implementation('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')

  // JPA (hibernate-core 와 hibernate-spatial 버전은 반드시 같게)
  implementation('org.hibernate:hibernate-core:6.6.55.Final')
  implementation('org.hibernate:hibernate-spatial:6.6.55.Final')
  implementation('org.glassfish.jaxb:jaxb-runtime:4.0.9')
  implementation('org.hibernate.validator:hibernate-validator:8.0.5.Final')

  // DB
  runtimeOnly('com.mysql:mysql-connector-j:8.4.0')
  implementation('com.zaxxer:HikariCP:5.1.0')
  runtimeOnly('org.slf4j:slf4j-simple:2.0.13')

  // 인증 / JSON
  implementation('org.mindrot:jbcrypt:0.4')
  implementation('com.fasterxml.jackson.core:jackson-databind:2.17.2')

  // 테스트
  testImplementation(platform("org.junit:junit-bom:${junitVersion}"))
  testImplementation('org.junit.jupiter:junit-jupiter')
  testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
  useJUnitPlatform()
  // 통합 테스트용 DB 정보 전달: gradlew test -Dit.db.url=... -Dit.db.username=... -Dit.db.password=...
  systemProperties System.getProperties().findAll { it.key.toString().startsWith('it.') }
}
