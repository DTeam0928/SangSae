# ============================================================
# 상새(SangSae) 공용 설정 (git 에 올라가는 파일 — 비밀값 넣지 말 것)
# 비밀값은 application-local.properties(같은 src/main/resources 폴더, git 제외)나
# 환경변수(SANGSAE_DB_PASSWORD 처럼 대문자+밑줄)로 덮어쓴다.
# ============================================================

# 외부에서 접속하는 주소 (OAuth redirect_uri 생성에 사용, 끝에 / 없이)
app.base-url=http://localhost:8080/sangsae

# ---- DB ----
# persistence.xml 의 persistence-unit 이름
jpa.persistence-unit=default
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:8306/sangsae?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
db.username=sangsae
db.password=
db.pool.max-size=10
db.pool.min-idle=2

# ---- 보안 ----
security.bcrypt.cost=10

# ---- 기본 닉네임: 접두어 + 숫자 ----
nickname.prefixes=여행자,탐험가,산책러,모험가
nickname.digits=4

# ---- 소셜 로그인 ----
# client-id 가 비어 있는 제공자는 비활성화된다 (버튼 클릭 시 "준비 중" 안내)
# redirect-uri 를 비우면 {app.base-url}/oauth/{google|x|apple}/callback 으로 자동 설정
oauth.state-cookie.secure=true

oauth.google.client-id=
oauth.google.client-secret=
oauth.google.scope=openid email profile

oauth.x.client-id=
oauth.x.client-secret=
oauth.x.scope=tweet.read users.read
# 이메일 권한이 승인된 앱이면 profile_image_url,confirmed_email
oauth.x.user-fields=profile_image_url

# Apple: client-id 는 Services ID. 개인키는 private-key-path(.p8 경로) 또는 private-key(PEM 내용) 중 하나
oauth.apple.client-id=
oauth.apple.team-id=
oauth.apple.key-id=
oauth.apple.private-key-path=
oauth.apple.scope=name email
